name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar erro
        if: failure()
        run: |
          MSG=$(grep -E "error:|^e: |What went wrong|Could not|> " build.log | grep -v "^> Task" | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erro na compilacao::${MSG}"

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk VozEOlhar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VozEOlhar-apk
          path: VozEOlhar.apk
